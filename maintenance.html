<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Manutenção de Viaturas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="box">
    <form id="maintenanceForm">
      <fieldset>
        <legend><b>Registro de Manutenção de Viaturas</b></legend>
        <br>

        <div class="inputRow">
          <div class="inputBox">
            <label for="vehicle">Viatura:</label>
            <select id="vehicle" name="vehicle" required>
              <option value="">Selecionar Viatura</option>
              <option value="89-77-XA">89-77-XA</option>
              <option value="08-AS-84">08-AS-84</option>
              <option value="56-GH-18">56-GH-18</option>
              <option value="35-HU-20">35-HU-20</option>
              <option value="RESERVA">22-FJ-72</option>
              <option value="VIATURA">VIATURA</option>
            </select>
          </div>

          <div class="inputBox">
            <label for="maintenance_date">Data:</label>
            <input type="date" id="maintenance_date" name="maintenance_date" required>
          </div>
        </div>

        <div class="inputRow">
          <div class="inputBox">
            <label for="km">KM:</label>
            <input type="number" id="km" name="km" min="0" required>
          </div>
        </div>

        <div class="inputRow">
          <div class="inputBox">
            <label for="observations">Observações:</label>
            <textarea id="observations" name="observations" rows="4" placeholder="Descreva a manutenção realizada" required></textarea>
          </div>
        </div>

        <button type="submit">Registrar Manutenção</button>
      </fieldset>
    </form>
  </div>

  <button onclick="window.location.href='maintenanceList.html'">Ver Manutenções</button>
  <button onclick="window.location.href='Menu.html'">Menu</button>
  <button onclick="window.location.href='timeline.html'">Ver Disponibilidades</button>

  <script type="module" src="maintenance.js"></script>
</body>
</html>
